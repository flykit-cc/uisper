name: Uisper
options:
  bundleIdPrefix: cc.flykit
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Natively Dev"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_APP_SANDBOX: "NO"
packages:
  UisperCore:
    path: UisperCore
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.4
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  Uisper:
    type: application
    platform: macOS
    sources:
      - path: Uisper
        excludes: ["Info.plist"]
    dependencies:
      - package: UisperCore
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-transformers
        product: Tokenizers
    entitlements:
      path: Uisper/Uisper.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.flykit.uisper
        PRODUCT_NAME: uisper
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Uisper/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
